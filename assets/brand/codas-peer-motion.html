<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codas · PEER Brand Motion</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#191a18}
body{min-height:100vh;display:grid;place-items:center}
#peer-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#191a18;border-radius:16px;padding:38px 15px 30px;color:#f4f4ef;font-family:Arial,sans-serif}
#peer-brand .p{animation:peer-flow 2.8s infinite ease-in-out;animation-delay:calc(var(--i)*.29s)}
@keyframes peer-flow{0%,40%,100%{fill:#f4f4ef;opacity:.7}15%{fill:#e23930;opacity:1}}
#peer-brand .brand{font-size:36px;font-weight:800;letter-spacing:-2px;margin-top:13px}
#peer-brand .tagline{font-size:10px;letter-spacing:2px;color:#a5a69e;margin-top:10px;text-align:center}
@media(prefers-reduced-motion:reduce){#peer-brand .p{animation:none}}
</style>
</head>
<body>
<div id="peer-brand">
<svg viewBox="0 0 120 120" width="142" height="142" role="img" aria-label="Codas peer-to-peer network logo">
<circle cx="60" cy="27" r="10" fill="#f4f4ef"/>
<circle cx="25" cy="87" r="10" fill="#f4f4ef"/>
<circle cx="95" cy="87" r="10" fill="#e23930"/>
<g fill="#f4f4ef">
<circle class="p" style="--i:0" cx="48.3" cy="47" r="4"/>
<circle class="p" style="--i:1" cx="36.7" cy="67" r="4"/>
<circle class="p" style="--i:2" cx="48.3" cy="87" r="4"/>
<circle class="p" style="--i:3" cx="71.7" cy="87" r="4"/>
<circle class="p" style="--i:4" cx="83.3" cy="67" r="4"/>
<circle class="p" style="--i:5" cx="71.7" cy="47" r="4"/>
</g>
</svg>
<div class="brand">codas<span style="color:#e23930">.</span></div>
<div class="tagline">ROUTE THE PROJECT, NOT DEVICES.</div>
</div>
</body>
</html>
