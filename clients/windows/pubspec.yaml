name: codas_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+8

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/Roboto-LICENSE.txt
  fonts:
    - family: CodasLogo
      fonts:
        - asset: assets/brand/Roboto-Black.ttf
          weight: 900
