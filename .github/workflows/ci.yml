name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Test production helpers without accessing production
        run: python3 -B -m unittest discover -s scripts/mac/production -p 'test_*.py' -v

      - name: Set up Java for Android protocol checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test Android protocol and stream callback boundaries
        run: |
          sh mobile/android/test/protocol-test.sh
          sh mobile/android/test/stream-session-test.sh

  mac-menu:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify native UI, workspace model, managed launcher and installer recovery
        run: npm run test:mac

      - name: Build signed menu archive
        run: zsh scripts/mac/menu-app/build.sh

      - name: Verify portable installer without installing
        run: |
          python3 scripts/mac/menu-app/package-release.py --source dist/Codas-mac-0.3.14.zip --output dist/Codas-mac-0.3.14-installer
          zsh dist/Codas-mac-0.3.14-installer/Install-Codas-mac.command --plan
